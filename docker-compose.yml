version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: eclipse_db
    environment:
      POSTGRES_USER: eclipse_user
      POSTGRES_PASSWORD: eclipse_password
      POSTGRES_DB: eclipse_db
    ports:
      - "5432:5432"
    volumes:
      - eclipse_pg_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: eclipse_redis
    ports:
      - "6379:6379"
    volumes:
      - eclipse_redis_data:/data

volumes:
  eclipse_pg_data:
  eclipse_redis_data:
